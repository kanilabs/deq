[package]
name = "deq-cli"
description = "The `deq` command-line tool for Deq shapes."
readme = "README.md"
keywords = ["deq", "kurdish", "icons", "svg", "cli"]
categories = ["command-line-utilities", "graphics"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

include = ["src/**/*.rs", "data/*.json", "README.md", "LICENSE"]

[[bin]]
name = "deq"
path = "src/main.rs"

[dependencies]
deq-shapes = { path = "../deq-shapes", version = "0.0.0" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[lints]
workspace = true
