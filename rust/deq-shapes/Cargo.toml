[package]
name = "deq-shapes"
description = "Deq: traditional Kurdish tattoo shapes as an open, parametric design system."
readme = "README.md"
keywords = ["deq", "kurdish", "icons", "svg", "shapes"]
categories = ["graphics", "rendering"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

include = ["src/**/*.rs", "data/*.json", "README.md", "LICENSE"]

[dependencies]
image-webp = "=0.2.4"
jpeg-encoder = "=0.6.1"
regex = "=1.13.1"
resvg = { version = "=0.49.0", default-features = false }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
unicode-normalization = "=0.1.26"

[lints]
workspace = true
