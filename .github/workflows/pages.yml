name: Pages

# Builds the website (apps/site) and deploys it to GitHub Pages (ADR 0012).
# GitHub Pages serves one site per repository, so:
# - pushes to `develop` deploy a preview while the repository variable
#   PAGES_PRODUCTION is not "true" (before the first release);
# - a published release (tagged from `main`) always deploys production.
# Set PAGES_PRODUCTION=true after the first release so `develop` stops overwriting it.
on:
  push:
    branches: [develop]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build site
    if: github.event_name != 'push' || vars.PAGES_PRODUCTION != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The Fonts page needs the built icon fonts; fail instead of warning.
      DEQ_REQUIRE_FONTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - run: pnpm exec turbo run build --filter=@0xdolan/deq-core
      - run: pnpm --filter @0xdolan/deq-icons font-data fonts/build/geometry.json
      - run: uv run --frozen deq-fonts codepoints --check
      - run: uv run --frozen deq-fonts build
      - run: pnpm exec turbo run build --filter=@0xdolan/deq-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
