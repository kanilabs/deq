name: Release

# Publishes a release (ADR 0024). Pushing a signed tag vX.Y.Z (from `main`) runs every job:
# verify → build (assets, CLI binaries, .deb) → publish to npm, PyPI and crates.io → GitHub
# Release with checksums, a Sigstore signature, build provenance and a CycloneDX SBOM → Pages.
# Pull requests into `main` (the release/* and hotfix/* branches) and runs by hand
# (workflow_dispatch) are dry runs: they build and check everything, run the registries' dry
# runs and publish nothing.
#
# Registries use trusted publishing (OIDC) from the `release` environment. npm and crates.io
# only trust packages that exist, so the first release may use the NPM_TOKEN and
# CARGO_REGISTRY_TOKEN environment secrets; delete them once trusted publishing is set up.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    name: Verify version, tag and tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - id: version
        name: Read the version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >>"$GITHUB_OUTPUT"
      - name: Every manifest has the same version
        run: node scripts/version.ts --check
      - name: The tag matches, is signed, is on main and has release notes
        if: env.PUBLISH == 'true'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ "$TAG" == "v$VERSION" ]] || { echo "tag $TAG does not match version $VERSION"; exit 1; }
          [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]] || { echo "$TAG is not an annotated tag"; exit 1; }
          git cat-file tag "refs/tags/$TAG" | grep -qE -- '-----BEGIN (PGP|SSH) SIGNATURE-----' \
            || { echo "$TAG is not signed"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
          node scripts/release-notes.ts "$VERSION" >/dev/null
      - run: pnpm exec turbo run build --filter='./packages/*'
      - run: pnpm exec turbo run test --filter='./packages/*'
      - run: uv run pytest
      - run: cargo test --workspace --locked

  assets:
    name: Fonts, icon packs and brand kit
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DEQ_REQUIRE_FONTS: "1"
      DEQ_REQUIRE_MEDIA: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          cache: "false"
      - run: pnpm exec turbo run build --filter='./packages/*'
      - run: pnpm --filter @0xdolan/deq-icons font-data fonts/build/geometry.json
      - run: pnpm --filter @0xdolan/deq-generator font-data fonts/build/leet.json
      - run: uv run --frozen deq-fonts codepoints --check
      - run: uv run --frozen deq-fonts build
      - run: uv run --frozen deq-assets variants
      - run: pnpm exec turbo run build --filter=@0xdolan/deq-site
      - name: Pack the fonts, icons, completions and brand kit
        run: |
          out=dist/release
          mkdir -p "$out" dist/icons dist/completions
          zip -qrjX "$out/deq-fonts-$VERSION.zip" fonts/dist fonts/LICENSE.md
          deq() { node packages/cli/dist/bin.js "$@"; }
          deq export --all --format svg --out dist/icons
          deq export --all --format png --sizes 24,48,96,256 --out dist/icons
          (cd dist/icons/svg/24 && zip -qrX "../../../../$out/deq-icons-svg-$VERSION.zip" .)
          (cd dist/icons/png && zip -qrX "../../../$out/deq-icons-png-$VERSION.zip" .)
          cp apps/site/dist/brand/deq-brand-kit.zip "$out/deq-brand-kit-$VERSION.zip"
          deq completion bash >dist/completions/deq.bash
          deq completion zsh >dist/completions/_deq
          deq completion fish >dist/completions/deq.fish
          deq completion powershell >dist/completions/deq.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: completions
          path: dist/completions/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fonts-dist
          path: fonts/dist/
          if-no-files-found: error

  binaries:
    name: CLI binary (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and the target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - run: cargo build --release --locked -p deq-cli --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/deq
            target/${{ matrix.target }}/release/deq.exe
          if-no-files-found: error

  deb:
    name: Debian packages (${{ matrix.arch }})
    needs: assets
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fonts-dist
          path: fonts/dist/
      - name: Install lintian and cargo-deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lintian
          rustup show active-toolchain || rustup toolchain install
          cargo install cargo-deb --version 3.8.0 --locked
      - run: packaging/debian/build.sh
      - run: lintian --fail-on warning target/deb/*.deb
      - name: Install on each Ubuntu LTS in Docker
        run: packaging/debian/test.sh
      - name: Keep one fonts-deq (it is the same on every architecture)
        if: matrix.arch != 'amd64'
        run: rm target/deb/fonts-deq_*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: target/deb/*.deb
          if-no-files-found: error

  npm:
    name: npm
    needs: [verify, assets, binaries, deb]
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DIST_TAG: ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          python: "false"
          cache: "false"
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          IFS=. read -r major minor patch <<<"$(npm --version)"
          (( major > 11 || (major == 11 && (minor > 5 || (minor == 5 && patch >= 1))) )) \
            || { echo "npm $(npm --version) is too old for trusted publishing"; exit 1; }
      - run: pnpm exec turbo run build --filter='./packages/*'
      - name: Pack (pnpm turns workspace:* into the version)
        run: |
          for pkg in core icons exporters generator react vue svelte elements cli; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist/npm" >/dev/null)
          done
          ls dist/npm
      - name: Publish (dry run unless this is a tag)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [[ -n "${NPM_TOKEN:-}" ]] && npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
          for pkg in core icons exporters generator react vue svelte elements cli; do
            file="dist/npm/0xdolan-deq-$pkg-$VERSION.tgz"
            if [[ "$PUBLISH" != true ]]; then
              npm publish "$file" --dry-run --access public --tag "$DIST_TAG"
            elif npm view "@0xdolan/deq-$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "@0xdolan/deq-$pkg@$VERSION is already published"
            else
              npm publish "$file" --access public --tag "$DIST_TAG" --provenance
            fi
          done

  pypi:
    name: PyPI
    needs: [verify, assets, binaries, deb]
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: "false"
      - run: uv build --package deq-shapes --out-dir dist/python
      - name: The wheel installs and runs
        run: |
          uv venv --quiet /tmp/deq-venv
          uv pip install --quiet --python /tmp/deq-venv dist/python/*.whl
          /tmp/deq-venv/bin/deq --version
          /tmp/deq-venv/bin/deq render dot-rosette --out - | grep -q "<svg"
      - if: env.PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/python/
          skip-existing: true

  crates:
    name: crates.io
    needs: [verify, assets, binaries, deb]
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dry run
        if: env.PUBLISH != 'true'
        run: cargo publish --workspace --locked --dry-run
      - name: Use the bootstrap token if there is one
        if: env.PUBLISH == 'true'
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: if [[ -n "${CARGO_REGISTRY_TOKEN:-}" ]]; then echo "bootstrap=true"; else echo "bootstrap=false"; fi >>"$GITHUB_OUTPUT"
      - name: Trusted publishing token
        if: env.PUBLISH == 'true' && steps.token.outputs.bootstrap == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish deq-shapes, then deq-cli
        if: env.PUBLISH == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in deq-shapes deq-cli; do
            if curl -sfA "deq-release (github.com/kanilabs/deq)" -o /dev/null "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              echo "$crate $VERSION is already published"
            else
              cargo publish -p "$crate" --locked
            fi
          done

  release:
    name: GitHub Release
    needs: [verify, npm, pypi, crates]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
      - name: Archive the CLI binaries
        run: |
          out=release
          mkdir -p "$out"
          cp artifacts/release-assets/* artifacts/deb-*/*.deb "$out/"
          # GitHub renames "~" to "." in asset names (1.0.0~rc.1), so name the files that way
          # before the checksums; the version inside each package keeps the "~".
          for f in "$out"/*~*; do
            if [[ -e "$f" ]]; then mv -- "$f" "${f//\~/.}"; fi
          done
          for dir in artifacts/bin-*; do
            target=${dir#artifacts/bin-}
            stage="deq-$VERSION-$target"
            mkdir -p "$stage/completions"
            cp "$dir"/deq* rust/deq-cli/README.md LICENSE packaging/man/deq.1 "$stage/"
            cp artifacts/completions/* "$stage/completions/"
            chmod 755 "$stage"/deq*
            if [[ "$target" == *windows* ]]; then
              zip -qrX "$out/$stage.zip" "$stage"
            else
              tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$out/$stage.tar.gz" "$stage"
            fi
          done
          ls -l "$out"
      - name: CycloneDX SBOM of every npm, PyPI and crates dependency
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: release/deq-${{ needs.verify.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: (cd release && sha256sum -- * >SHA256SUMS)
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the checksums with Sigstore (keyless)
        run: cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS
      - name: Build provenance for every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.ts "$VERSION" >notes.md
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" release/* --verify-tag --title "Deq $VERSION" --notes-file notes.md "${flags[@]}"

  pages:
    name: Website
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
