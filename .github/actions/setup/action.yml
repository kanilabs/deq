name: Setup toolchains
description: Install pinned Node/pnpm, Python/uv and Rust toolchains and project dependencies.
inputs:
  rust:
    description: Install the Rust toolchain and cache.
    default: "true"
  python:
    description: Install uv and sync Python dependencies.
    default: "true"
  cache:
    description:
      Restore and save the pnpm, uv and Rust caches. The release workflow turns it off, so
      a poisoned cache can never reach a published package.
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - name: Install Node dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.5"
        enable-cache: ${{ inputs.cache }}
    - if: inputs.python == 'true'
      name: Install Python dependencies
      shell: bash
      run: uv sync --frozen
    - if: inputs.rust == 'true'
      name: Install Rust toolchain (from rust-toolchain.toml)
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - if: inputs.rust == 'true' && inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
