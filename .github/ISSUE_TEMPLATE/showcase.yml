name: Showcase a project
description: Submit a project that uses Deq for the showcase page.
labels: ["type: showcase", "status: triage"]
body:
  - type: input
    id: name
    attributes:
      label: Project name
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: Project URL (https)
    validations: { required: true }
  - type: input
    id: repo
    attributes:
      label: Source code URL
  - type: textarea
    id: about
    attributes:
      label: Short description (one or two sentences)
    validations: { required: true }
  - type: input
    id: shapes
    attributes:
      label: Deq shape ids it uses
      placeholder: "roj-half-sun, ring-stem"
    validations: { required: true }
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: I run this project, or its owner agrees to be shown.
          required: true
        - label: The site may be shown in a sandboxed iframe, with a screenshot as a fallback.
          required: true
