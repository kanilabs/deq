[project]
name = "deq-shapes"
version = "1.0.0rc1"
description = "Deq: traditional Kurdish tattoo shapes as an open, parametric design system (Python library and CLI)."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "0xdolan", email = "0xdolan@gmail.com" }]
keywords = ["deq", "kurdish", "icons", "svg", "shapes", "design-system"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["resvg-py==0.5.0", "pillow==13.0.0"]

[project.scripts]
deq = "deq_shapes.cli:run"

[project.urls]
Homepage = "https://kanilabs.github.io/deq/"
Repository = "https://github.com/kanilabs/deq"
Issues = "https://github.com/kanilabs/deq/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deq_shapes"]
