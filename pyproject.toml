# uv workspace root (not a package). See python/ for members.
[project]
name = "deq-workspace"
version = "0.0.0"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

[tool.uv]
package = false
# Supply-chain age gate, same as pnpm minimumReleaseAge.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["python/*", "scripts/deq-assets", "scripts/deq-spec", "scripts/deq-fonts"]

[tool.uv.sources]
deq-shapes = { workspace = true }
deq-assets = { workspace = true }
deq-spec = { workspace = true }
deq-fonts = { workspace = true }

[dependency-groups]
dev = [
    "deq-shapes",
    "deq-assets",
    "deq-spec",
    "deq-fonts",
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6",
    "mypy>=1.15",
    "ruff>=0.11",
    "pip-audit>=2.9",
    "zizmor>=1.16",
    "uharfbuzz==0.57.0",
]
# Font QA (fontbakery, ots-sanitize): `uv run --group fonts fontbakery ...`.
fonts = [
    "fontbakery==1.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python/*/src", "python/*/tests", "scripts/*/src", "scripts/*/tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "PT", "ANN"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# The port walks untyped JSON (specs, options, CLI data) exactly as the TS reference does.
"python/deq-shapes/**" = ["ANN401"]

[tool.mypy]
strict = true
python_version = "3.12"
files = [
    "python/deq-shapes/src",
    "python/deq-shapes/tests",
    "scripts/deq-assets/src",
    "scripts/deq-assets/tests",
    "scripts/deq-spec/src",
    "scripts/deq-spec/tests",
    "scripts/deq-fonts/src",
    "scripts/deq-fonts/tests",
]

[[tool.mypy.overrides]]
# jsonschema ships no type information; types-jsonschema would add another dependency.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# fontTools and uharfbuzz ship no type information and have no stub packages.
module = ["fontTools", "fontTools.*", "uharfbuzz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=deq_shapes --cov=deq_assets --cov=deq_spec --cov=deq_fonts --cov-report=term-missing:skip-covered --cov-fail-under=95"
testpaths = ["python", "scripts/deq-assets/tests", "scripts/deq-spec/tests", "scripts/deq-fonts/tests"]
