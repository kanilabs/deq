[project]
name = "deq-fonts"
version = "0.0.0"
description = "Internal tool: build the Deq icon fonts (static, variable and colour) from the shape spec. Not published."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "0xdolan", email = "0xdolan@gmail.com" }]
classifiers = ["Private :: Do Not Upload", "Typing :: Typed"]
dependencies = [
    "fonttools[woff]==4.68.0",
    "skia-pathops==0.9.2",
    "uharfbuzz==0.57.0",
]

[project.scripts]
deq-fonts = "deq_fonts.cli:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deq_fonts"]
